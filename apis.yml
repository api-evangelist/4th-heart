apis:
- aid: 4th-heart:4th-heart-commerce
  name: 4th & Heart Agentic Commerce (UCP / MCP)
  description: The agent-facing commerce surface of the 4th & Heart online store, implemented by Shopify's
    native Universal Commerce Protocol support on the merchant's own domain. A remote MCP server at https://fourthandheart.com/api/ucp/mcp
    answers tools/list anonymously with 13 tools covering catalog search and lookup, cart lifecycle, checkout
    lifecycle and order retrieval. The UCP merchant profile at /.well-known/ucp declares protocol version
    2026-08-25 with two prior dated versions still served, and the shopping, cart, checkout, fulfillment,
    discount and order capabilities. Checkout completion requires contemporaneous buyer approval.
  image: https://fourthandheart.com/cdn/shop/files/4thandHeartGhee.png?v=1730292913
