aid: 4th-heart
name: 4th & Heart
description: '4th & Heart is a California-based consumer packaged goods company that makes grass-fed,
  pasture-raised ghee (clarified butter) and ghee-based spreads, sold direct-to-consumer from its own
  Shopify storefront at fourthandheart.com and through national grocery retail. It is not a software vendor
  and publishes no developer program, but the storefront exposes a real, unauthenticated agent-commerce
  surface: a Universal Commerce Protocol (UCP) merchant profile at /.well-known/ucp, a live Model Context
  Protocol server at /api/ucp/mcp serving 13 catalog, cart, checkout and order tools with full JSON Schema,
  an /llms.txt and /agents.md agent instruction document, and Shopify customer-account OAuth 2.0 / OpenID
  Connect discovery metadata on its own domain.'
