  shape: '{ jsonrpc, id, error: { code, message, data: { code, content, continue_url } } }'
  http_status_on_error: 422
  note: >-
    The HTTP status and the JSON-RPC error code carry different information. A protocol-level failure
    returns HTTP 422 with a JSON-RPC error object; agents must read the body, not the status line.
