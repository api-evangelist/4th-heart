error_envelope:
  shape: JSON-RPC 2.0 error object with a nested data.code discriminator
  http_status_on_error: 422
  see: errors/4th-heart-problem-types.yml
rate_limit_signaling:
  documented: true
  headers_observed: []
  note: >-
    /llms.txt states the MCP endpoint is rate limited per IP and that agents should back off on 429.
    No RateLimit-* or X-RateLimit-* headers were present on the observed 200 responses, so an agent
    learns its budget only by being refused.
  see: rate-limits/4th-heart-rate-limits.yml
money:
  representation: >-
    Integer minor units paired with an ISO 4217 currency code, e.g. {"amount": 600, "currency":
    "USD"} is $6.00. Stated in every tool description; convert before quoting a price to a buyer.
human_in_the_loop:
  required_for: [complete_checkout]
  note: >-
    Published instructions require contemporaneous buyer approval at the moment of payment. Agents
    that cannot obtain it are directed to route the purchase through Shop Pay instead.
