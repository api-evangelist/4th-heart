method: probed
source: >-
  https://fourthandheart.com/llms.txt, https://fourthandheart.com/agents.md, and direct probes of
  https://fourthandheart.com/api/ucp/mcp
note: >-
  Cross-cutting semantics for the agent-commerce surface. Derived from the published agent
  instructions and from the probed MCP tool schemas, not from an OpenAPI — 4th & Heart publishes none.
authentication:
  style: none on the storefront MCP endpoint; OAuth 2.0 / OIDC on the customer-account surface
  agent_identity: >-
    meta.ucp-agent.profile, a resolvable URI naming the calling agent, is required on tools/call
  see: authentication/4th-heart-authentication.yml
idempotency:
  supported: false
  coverage: none
  mechanism: null
  header: null
  retention: null
  note: >-
    No idempotency key, request-id echo or replay-protection mechanism appears in any of the 13 MCP
    tool inputSchemas, in /llms.txt, or in /agents.md. The mutating tools (create_cart, update_cart,
    create_checkout, update_checkout, complete_checkout) accept no client-supplied idempotency token,
    so a retried complete_checkout is not protected by contract. Recorded as none rather than
    unknown: the full tool schema set was retrieved and inspected, and the field is genuinely absent.
reversibility:
  grade: documented
  note: >-
    Reversal operations exist and are named, but no reversal WINDOW is stated for any of them. The one
    stated window on the site belongs to a manual retail returns process, not to an API operation, so
    it does not upgrade this grade to verified.
  surfaces:
  - write_operation: create_cart
    reversal_operation: cancel_cart
    kind: cancel
    window: null
    docs: https://fourthandheart.com/llms.txt
    evidence: cancel_cart present in the probed tools/list
  - write_operation: create_checkout
    reversal_operation: cancel_checkout
    kind: cancel
    window: null
    docs: https://fourthandheart.com/llms.txt
    evidence: >-
      cancel_checkout present in the probed tools/list. The docs do not state whether it remains
      valid after complete_checkout; do not assume it does.
  - write_operation: complete_checkout
    reversal_operation: null
    kind: out-of-band refund
    window: 30 days from purchase
    docs: https://fourthandheart.com/policies/refund-policy
    evidence: >-
      "Our policy lasts 30 days. If 30 days have gone by since your purchase, unfortunately we can't
      offer you a refund or exchange." This is a human process initiated by emailing
      wecare@4thandheart.com — there is no refund or void tool on the MCP endpoint. An agent that
      completes a checkout cannot reverse it programmatically.
pagination:
  style: unknown
  note: >-
    search_catalog and lookup_catalog accept a catalog object; the published schema does not document
    cursor or offset parameters, and no paged response was exercised.
